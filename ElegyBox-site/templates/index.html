<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElegyBox — Classical MIDI Generation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="ornament-line"></div>
      <div class="logo">
        <span class="logo-glyph">𝄞</span>
        <h1>ElegyBox</h1>
        <span class="logo-glyph">𝄞</span>
      </div>
      <p class="tagline">AI-Powered Classical Music Generation</p>
      <div class="ornament-line"></div>
    </div>
  </header>

  <main>

    <!-- ── Generate ───────────────────────────────────────────── -->
    <section class="generate-section">
      <div class="generate-panel">
        <div class="preset-selector">
          <label class="selection-label" for="presetSelect">Preset</label>
          <select id="presetSelect" class="preset-select">
            <option value="" disabled selected>— choose a preset —</option>
          </select>
          <p class="preset-desc-display" id="presetDescDisplay"></p>
        </div>
        <div class="bpm-control">
          <label class="selection-label" for="bpmDisplay">BPM</label>
          <div class="bpm-row">
            <input type="number" id="bpmDisplay" class="bpm-input" min="20" max="300" readonly>
            <label class="bpm-override-label" title="Override preset BPM">
              <input type="checkbox" id="bpmOverride">
              <span>Override</span>
            </label>
          </div>
        </div>
        <button class="generate-btn" id="generateBtn">
          <span class="btn-icon">◈</span>
          <span class="btn-label">Generate</span>
        </button>
      </div>

      <div class="generation-log" id="generationLog" hidden>
        <div class="log-header">
          <span class="log-status" id="logStatus">Initialising…</span>
          <span class="log-spinner" id="logSpinner" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <!-- ── Player ─────────────────────────────────────────────── -->
    <section class="player-section" id="playerSection" hidden>
      <div class="section-header">
        <h2>Now Playing</h2>
        <span class="now-playing-name" id="nowPlayingName"></span>
      </div>
      <div class="instrument-loading" id="instrumentLoading" hidden>
        <span>Loading piano samples…</span>
      </div>
      <canvas id="pianoRoll" class="piano-roll" title="Piano roll visualization"></canvas>
      <div class="player-controls">
        <button class="ctrl-btn" id="playBtn" title="Play / Pause">▶</button>
        <div class="progress-container" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="playhead"      id="playhead"></div>
        </div>
        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        <div class="volume-control">
          <span class="vol-icon">♪</span>
          <input type="range" id="volumeSlider" class="vol-slider" min="0" max="200" value="80" title="Volume">
        </div>
        <a class="ctrl-btn dl-btn" id="downloadBtn" title="Download MIDI">⬇</a>
      </div>
    </section>

    <!-- ── Library ────────────────────────────────────────────── -->
    <section class="library-section">
      <div class="section-header">
        <h2>Song Library</h2>
        <button class="ghost-btn" id="refreshBtn">↺ Refresh</button>
      </div>
      <div class="song-list" id="songList">
        <div class="empty-state">No songs yet — generate something above.</div>
      </div>
    </section>

  </main>

  <footer>
    <div class="footer-ornament">✦ &nbsp; ElegyBox &nbsp; ✦</div>
    <p>Classical piano music generated by a two-stage GPT trained on the Mutopia corpus.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <script src="/static/app.js?v=7"></script>
</body>
</html>
